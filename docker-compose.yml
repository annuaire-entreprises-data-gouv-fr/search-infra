# This docker compose configuration is not for production use
# It's sole purpose is for local Airflow test and development

services:
  airflow:
    build:
      context: .
      dockerfile: airflow.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: True
      AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: False
      AIRFLOW__LOGGING__MIN_LENGTH_MASKED_SECRET: 0
      # Pour prendre en compte une modification tout de suite : airflow dags reserialize
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: 300
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: 1
    env_file:
      - .env
    volumes:
      - .:${AIRFLOW_VAR_AIRFLOW_DAG_HOME:-/opt/airflow/dags/}/data_pipelines_annuaire
      - ${LOCAL_TMP_PATH:-.docker}/tmp:${AIRFLOW_VAR_AIRFLOW_DAG_TMP}
      - ${LOCAL_TMP_PATH:-.docker}/logs:/opt/airflow/logs
      - ${LOCAL_TMP_PATH:-.docker}/scripts:/opt/airflow/scripts:ro
      - ${LOCAL_TMP_PATH:-.docker}/ssh:/home/airflow/.ssh/:ro
    ports:
      - "127.0.0.1:${AIRFLOW_API_PORT:-8080}:8080"
      - "127.0.0.1:${AIRFLOW_LOG_SERVER_PORT:-8793}:8793"
    entrypoint: airflow standalone
    networks:
      - annuaire-network
    container_name: "${DOCKER_CONTEXT:-ade}-${DOCKER_ENV:-test}-airflow"

  postgres:
    image: postgres:16
    user: root
    volumes:
      - ${LOCAL_TMP_PATH:-.docker}/pg-airflow:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    ports:
      - "127.0.0.1:${AIRFLOW_POSTGRES_PORT:-5432}:5432"
    networks:
      - annuaire-network
    container_name: "${DOCKER_CONTEXT:-ade}-${DOCKER_ENV:-test}-airflow-db"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    environment:
      - discovery.type=single-node
      - cluster.name=annuaire-search-cluster
      - node.name=annuaire-es-node-1
      - bootstrap.memory_lock=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=true
      - ELASTIC_USER=${AIRFLOW_VAR_ELASTIC_USER:-elastic}
      - ELASTIC_PASSWORD=${AIRFLOW_VAR_ELASTIC_PASSWORD:-elastic}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${LOCAL_TMP_PATH:-.docker}/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "${AIRFLOW_VAR_ELASTIC_PORT:-9200}:9200"
      - "9300:9300"
    networks:
      - annuaire-network
    container_name: "${DOCKER_CONTEXT:-ade}-${DOCKER_ENV:-test}-elasticsearch"

  # Object Storage S3 local, sans authentification : n'importe quelle clé est acceptée.
  # Utilisé par les DAGs seulement si AIRFLOW_VAR_OBJECT_STORAGE_URL=http://s3:8333 dans le .env
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data
    restart: unless-stopped
    volumes:
      - ${LOCAL_TMP_PATH:-.docker}/s3:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
      # Explorateur web des fichiers : http://127.0.0.1:8888/buckets/
      - "127.0.0.1:${S3_UI_PORT:-8888}:8888"
    networks:
      - annuaire-network
    container_name: "${DOCKER_CONTEXT:-ade}-${DOCKER_ENV:-test}-s3"

networks:
  annuaire-network:
