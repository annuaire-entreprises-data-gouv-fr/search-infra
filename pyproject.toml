[project]
name = "annuaire-search-infra"
version = "1.0.0"
description = "Pipelines Airflow qui collectent, traitent et indexent les données d'entreprises de l'Annuaire des Entreprises"
license = "MIT"
requires-python = ">=3.14,<3.15"
readme = "README.md"

dependencies = [
    "boto3==1.43.95",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "elasticsearch==9.2.1",
    "requests==2.34.2",
    "pytest==9.1.1",
    "pydantic==2.14.1",
    "pyproj==3.8.0",
    "redis==8.1.0",
    "pyarrow==25.0.1",
]

[dependency-groups]
# Fourni par l'image Docker, à garder aligné sur AIRFLOW_VERSION dans airflow.Dockerfile
airflow = ["apache-airflow==3.3.2"]
# Utilisé par la CI et par les hooks pre-commit via `uv run`
dev = [
    "ruff>=0.16",
    "mypy>=2.4",
    "types-requests",
]

[project.urls]
Repository = "https://github.com/annuaire-entreprises-data-gouv-fr/search-infra"

[tool.uv]
# Le code est importé depuis le dossier du dépôt, il n'est pas installé comme package
package = false
default-groups = ["airflow", "dev"]

[tool.ruff]
src = ["data_pipelines_annuaire"]

[tool.ruff.lint]
ignore = ["TRY002", "BLE001", "RUF012"]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["data_pipelines_annuaire"]

# ty sert pour le moment uniquement aux IDE
# la CI et pre-commit vérifient les types avec mypy
# possibilité de tout migrer sur ty dans le futur
[tool.ty.environment]
root = [".."]

[tool.mypy]
strict_optional = false
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["^\\.venv/"]
