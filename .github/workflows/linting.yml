---
name: PR Validation
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        # --locked fails if uv.lock no longer matches pyproject.toml.
        # On failure: run `uv lock` locally and commit the updated uv.lock.
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked
      - name: Run Ruff
        run: uv run --no-sync ruff check --diff --output-format=github .
      - name: Run Mypy
        run: uv run --no-sync mypy .

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: data_pipelines_annuaire
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('data_pipelines_annuaire/uv.lock') }}
      - name: Install dependencies
        working-directory: data_pipelines_annuaire
        # --locked fails if uv.lock no longer matches pyproject.toml.
        # On failure: run `uv lock` locally and commit the updated uv.lock.
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked
      - name: unit tests
        working-directory: data_pipelines_annuaire
        run: uv run --no-sync pytest tests/unit_tests -v
